<style>
/* ═══════════════════════════════════════════════════════════════════════
   A committed single visual world: bone paper, ink, and struck metal.
   Every colour is painted explicitly so the page holds on any host ground.
   ═══════════════════════════════════════════════════════════════════ */
:root {
  color-scheme: light;

  --bone:   #EDE9DD;
  --bone-2: #E4DFD0;
  --card:   #F5F2E9;
  --ink:    #1E1B15;
  --ink-2:  #4A443A;
  --ink-3:  #756D5E;
  --rule:   #C9C2AE;
  --rule-2: #B3AB94;
  --stamp:  #8A3B1E;
  --aura:   #D3C5A6;

  --step-1: 15px;
  --step-2: 17px;
  --step-3: 21px;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }

body {
  margin: 0;
  background: var(--bone);
  color: var(--ink);
  font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
  font-size: var(--step-2);
  line-height: 1.5;
  overflow-x: hidden;
  transition: background-color .9s ease;
}

/* The wash of whichever country the coin last landed on */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background-color: var(--aura);
  opacity: .62;
  transition: background-color .9s ease;
  -webkit-mask-image: radial-gradient(88% 64% at 74% -10%, #000 0%, rgba(0,0,0,.5) 44%, transparent 74%);
  mask-image: radial-gradient(88% 64% at 74% -10%, #000 0%, rgba(0,0,0,.5) 44%, transparent 74%);
}
.wrap { position: relative; z-index: 1; }

/* Paper grain, fixed over everything */
body::after {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 60;
  opacity: .34;
  mix-blend-mode: multiply;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='140' height='140' filter='url(%23n)' opacity='.5'/></svg>");
}

a { color: var(--ink); text-underline-offset: 3px; text-decoration-thickness: 1px; }
a:hover { color: var(--stamp); }

:where(a, button, input, select, textarea, [tabindex]):focus-visible {
  outline: 2px solid var(--stamp);
  outline-offset: 3px;
}

.mono {
  font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 11px;
  letter-spacing: .1em;
  text-transform: uppercase;
  font-weight: 500;
}

/* ── Marginalia rails ──────────────────────────────────────────────── */
.rail {
  position: fixed;
  top: 0;
  bottom: 0;
  width: 48px;
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 40;
  pointer-events: none;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--ink);
}
.rail span { white-space: nowrap; writing-mode: vertical-rl; }
.rail-l { left: 0; }
.rail-r { right: 0; }
.rail-l span { transform: rotate(180deg); }
@media (min-width: 1080px) { .rail { display: flex; } }

/* ── Shell ─────────────────────────────────────────────────────────── */
.wrap { max-width: 1180px; margin: 0 auto; padding: 0 22px 110px; }
@media (min-width: 1080px) { .wrap { padding-inline: 72px; } }

.topbar {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 20px;
  padding: 18px 0 0;
}
.kicker {
  margin: 0;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .01em;
  text-transform: uppercase;
  line-height: 1.25;
  max-width: 30ch;
}
.lang {
  display: inline-flex;
  border: 1.5px solid var(--ink);
  border-radius: 999px;
  overflow: hidden;
  flex: 0 0 auto;
}
.lang button {
  appearance: none;
  border: 0;
  background: transparent;
  color: var(--ink);
  font-family: "Archivo", sans-serif;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .1em;
  padding: 6px 12px;
  cursor: pointer;
}
.lang button[aria-pressed="true"] { background: var(--ink); color: var(--bone); }

/* ── Hero ──────────────────────────────────────────────────────────── */
.hero {
  display: grid;
  gap: 26px;
  padding: 26px 0 8px;
  justify-items: center;
  text-align: center;
}
.hero h1 {
  margin: 0;
  font-size: clamp(36px, 8.6vw, 100px);
  line-height: .93;
  font-weight: 700;
  letter-spacing: -.035em;
  text-transform: uppercase;
  text-wrap: balance;
  max-width: 15ch;
}
.hero h1 .thin {
  font-family: "Newsreader", Georgia, serif;
  font-weight: 300;
  font-style: italic;
  text-transform: none;
  letter-spacing: -.01em;
}
.hero .sub {
  margin: 0;
  max-width: 42ch;
  color: var(--ink-2);
  font-family: "Newsreader", Georgia, serif;
  font-weight: 300;
  font-size: clamp(17px, 2.2vw, 21px);
  line-height: 1.45;
}

/* Coin toss */
.toss { display: grid; justify-items: center; gap: 18px; }
.coin-stage { width: min(62vw, 330px); aspect-ratio: 1; perspective: 1400px; }
.coin-btn {
  appearance: none;
  border: 0;
  padding: 0;
  background: transparent;
  width: 100%;
  height: 100%;
  cursor: pointer;
  display: block;
  transform-style: preserve-3d;
  transition: transform 1.35s cubic-bezier(.16,.84,.28,1);
  filter: drop-shadow(0 22px 26px rgba(40,33,20,.3));
}
.coin-btn svg { width: 100%; height: 100%; display: block; }
.toss-caption { color: var(--ink-3); text-align: center; margin: 0; }
.toss-caption b { color: var(--ink); font-weight: 700; letter-spacing: .12em; }

/* ── Quote, struck on landing ───────────────────────────────────────── */
.quote {
  margin: 0;
  max-width: 46ch;
  min-height: 136px;
  display: grid;
  gap: 10px;
  justify-items: center;
  align-content: start;
}
.quote blockquote {
  margin: 0;
  font-family: "Newsreader", Georgia, serif;
  font-weight: 300;
  font-style: italic;
  font-size: clamp(19px, 2.7vw, 27px);
  line-height: 1.28;
  letter-spacing: -.012em;
  text-wrap: balance;
}
.quote blockquote[dir="rtl"] {
  font-family: "Noto Sans Arabic", "Geeza Pro", serif;
  font-style: normal;
  font-size: clamp(20px, 2.8vw, 28px);
  line-height: 1.75;
}
.q-trans { margin: 0; color: var(--ink-2); font-size: 15.5px; max-width: 44ch; line-height: 1.45; }
.q-by { color: var(--ink-3); }
.quote.struck { animation: strike .55s cubic-bezier(.16,.84,.28,1) both; }
@keyframes strike {
  from { opacity: 0; transform: translateY(7px); }
  to   { opacity: 1; transform: none; }
}

/* ── Agenda ─────────────────────────────────────────────────────────── */
.agenda { list-style: none; margin: 0; padding: 0; border-top: 1.5px solid var(--ink); }
.agenda li {
  display: grid;
  grid-template-columns: 1fr;
  gap: 3px;
  padding: 18px 0 19px;
  border-bottom: 1px solid var(--rule);
}
@media (min-width: 620px) {
  .agenda li { grid-template-columns: 132px 1fr; gap: 22px; align-items: baseline; }
}
.agenda .t {
  font-family: "IBM Plex Mono", monospace;
  font-size: 13px;
  letter-spacing: .06em;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.agenda .l { font-size: var(--step-3); font-weight: 600; letter-spacing: -.022em; }
.agenda .a {
  display: block;
  margin-top: 2px;
  font-family: "Newsreader", Georgia, serif;
  font-weight: 300;
  font-style: italic;
  font-size: 17.5px;
  color: var(--stamp);
}

/* ── Facts ledger ──────────────────────────────────────────────────── */
.ledger {
  margin: 44px 0 0;
  width: 100%;
  border-top: 1.5px solid var(--ink);
  border-bottom: 1.5px solid var(--ink);
  display: grid;
  text-align: left;
}
@media (min-width: 720px) { .ledger { grid-template-columns: repeat(4, 1fr); } }
.ledger div { padding: 16px 0 17px; border-bottom: 1px solid var(--rule); }
.ledger div:last-child { border-bottom: 0; }
@media (min-width: 720px) {
  .ledger div { border-bottom: 0; border-left: 1px solid var(--rule); padding-left: 18px; }
  .ledger div:first-child { border-left: 0; padding-left: 0; }
}
.ledger dt { color: var(--ink-3); margin: 0 0 6px; }
.ledger dd {
  margin: 0;
  font-size: var(--step-1);
  font-weight: 600;
  letter-spacing: -.005em;
  line-height: 1.3;
}

/* ── Sections ──────────────────────────────────────────────────────── */
section { padding-top: 84px; }
.sec-head {
  display: flex;
  align-items: baseline;
  gap: 16px;
  border-bottom: 1.5px solid var(--ink);
  padding-bottom: 10px;
  margin-bottom: 28px;
}
.sec-head h2 {
  margin: 0;
  font-size: clamp(22px, 3.4vw, 34px);
  font-weight: 700;
  letter-spacing: -.028em;
  text-transform: uppercase;
  line-height: 1;
}
.sec-head .num { margin-left: auto; color: var(--ink-3); flex: 0 0 auto; }

.lede {
  max-width: 54ch;
  margin: 0 0 34px;
  font-family: "Newsreader", Georgia, serif;
  font-weight: 300;
  font-size: var(--step-3);
  line-height: 1.45;
  color: var(--ink-2);
}

/* ── Country coins ─────────────────────────────────────────────────── */
.coins {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(148px, 1fr));
  gap: 30px 20px;
}
.country { display: grid; gap: 12px; justify-items: center; text-align: center; align-content: start; }
.country .disc {
  width: 128px;
  max-width: 100%;
  aspect-ratio: 1;
  filter: drop-shadow(0 10px 12px rgba(40,33,20,.26));
  transition: transform .5s cubic-bezier(.16,.84,.28,1);
}
.country:hover .disc { transform: rotate(-8deg) scale(1.05); }
.country .disc svg { width: 100%; height: 100%; display: block; }
.country h3 {
  margin: 0;
  font-size: var(--step-1);
  font-weight: 700;
  letter-spacing: -.01em;
  text-transform: uppercase;
}
.country p {
  margin: 0;
  font-family: "Newsreader", Georgia, serif;
  font-weight: 300;
  font-size: 14.5px;
  line-height: 1.4;
  color: var(--ink-2);
  max-width: 25ch;
}

/* ── Menu ──────────────────────────────────────────────────────────── */
.course { margin-bottom: 40px; }
.course > h3 {
  margin: 0 0 5px;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--stamp);
}
.course > .rule { border: 0; border-top: 1px solid var(--rule-2); margin: 0; }
.dish {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 4px 22px;
  padding: 15px 0;
  border-bottom: 1px solid var(--rule);
  align-items: baseline;
}
.dish:last-child { border-bottom: 0; }
.dish h4 {
  margin: 0;
  font-size: var(--step-2);
  font-weight: 600;
  letter-spacing: -.012em;
  line-height: 1.25;
}
.dish .desc {
  grid-column: 1;
  margin: 0;
  font-family: "Newsreader", Georgia, serif;
  font-weight: 300;
  font-size: 15.5px;
  line-height: 1.4;
  color: var(--ink-2);
  max-width: 58ch;
}
.dish .price {
  grid-row: 1 / span 2;
  grid-column: 2;
  align-self: start;
  margin: 0;
  font-family: "IBM Plex Mono", monospace;
  font-size: 14px;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  padding-top: 2px;
}
.supp {
  display: inline-block;
  margin-left: 8px;
  border: 1px solid var(--rule-2);
  border-radius: 999px;
  padding: 1px 7px 0;
  font-family: "IBM Plex Mono", monospace;
  font-size: 10.5px;
  letter-spacing: .04em;
  font-weight: 400;
  color: var(--ink-2);
  vertical-align: 2px;
}
.menu-note { margin: 0; color: var(--ink-2); font-size: 14.5px; max-width: 62ch; line-height: 1.55; }

/* ── Form ──────────────────────────────────────────────────────────── */
form { display: grid; gap: 30px; max-width: 780px; }
.field { display: grid; gap: 9px; }
.lbl { font-size: 13px; font-weight: 700; letter-spacing: .01em; text-transform: uppercase; }
.hint {
  color: var(--ink-3);
  font-size: 14.5px;
  font-family: "Newsreader", Georgia, serif;
  font-weight: 300;
  line-height: 1.4;
}

input[type="text"], textarea, select {
  width: 100%;
  background: var(--card);
  border: 1.5px solid var(--rule-2);
  color: var(--ink);
  font-family: "Archivo", sans-serif;
  font-size: 16px;
  padding: 11px 13px;
  border-radius: 0;
  transition: border-color .15s ease;
}
input[type="text"]::placeholder, textarea::placeholder { color: var(--ink-3); }
input[type="text"]:hover, textarea:hover, select:hover { border-color: var(--ink-2); }
textarea { min-height: 88px; resize: vertical; line-height: 1.5; }

select {
  appearance: none;
  padding-right: 38px;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' fill='none' stroke='%234A443A' stroke-width='1.6'/></svg>");
  background-repeat: no-repeat;
  background-position: right 13px center;
  cursor: pointer;
  text-overflow: ellipsis;
}

/* Attendance */
.choice { display: grid; gap: 10px; }
@media (min-width: 520px) { .choice { grid-template-columns: 1fr 1fr; } }
.choice label {
  display: flex;
  align-items: center;
  gap: 12px;
  background: var(--card);
  border: 1.5px solid var(--rule-2);
  padding: 15px 16px;
  cursor: pointer;
  font-size: 15px;
  font-weight: 600;
  transition: border-color .15s ease, background .15s ease;
}
.choice label:hover { border-color: var(--ink-2); }
.choice input { position: absolute; opacity: 0; pointer-events: none; }
.dot {
  width: 16px; height: 16px;
  border: 1.5px solid var(--rule-2);
  border-radius: 50%;
  flex: 0 0 auto;
  display: grid;
  place-items: center;
}
.dot::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: transparent; }
.choice input:checked + .dot { border-color: var(--stamp); }
.choice input:checked + .dot::after { background: var(--stamp); }
.choice label:has(input:checked) { border-color: var(--ink); background: var(--bone-2); }

/* Party stepper */
.stepper { display: inline-flex; border: 1.5px solid var(--ink); background: var(--card); width: fit-content; }
.stepper button {
  appearance: none;
  border: 0;
  background: transparent;
  color: var(--ink);
  font-family: "Archivo", sans-serif;
  width: 46px;
  font-size: 21px;
  line-height: 1;
  cursor: pointer;
}
.stepper button:disabled { color: var(--ink-3); cursor: not-allowed; }
.stepper output {
  min-width: 58px;
  display: grid;
  place-items: center;
  border-inline: 1.5px solid var(--ink);
  font-family: "IBM Plex Mono", monospace;
  font-size: 17px;
  font-variant-numeric: tabular-nums;
  padding: 12px 0;
}

/* Numbered steps */
.step {
  display: flex;
  align-items: baseline;
  gap: 12px;
  border-bottom: 1.5px solid var(--ink);
  padding-bottom: 8px;
  margin-bottom: 4px;
}
.step .n { font-family: "IBM Plex Mono", monospace; font-size: 12px; letter-spacing: .08em; }
.step h3 {
  margin: 0;
  font-size: 17px;
  font-weight: 700;
  letter-spacing: -.02em;
  text-transform: uppercase;
}

/* Guest cards */
.guests { display: grid; gap: 16px; }
.guest { background: var(--card); border: 1.5px solid var(--ink); }
.guest-head {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 15px;
  border-bottom: 1.5px solid var(--ink);
  background: var(--bone-2);
}
.guest-head .seat {
  font-family: "IBM Plex Mono", monospace;
  font-size: 12px;
  font-weight: 500;
  letter-spacing: .06em;
  flex: 0 0 auto;
}
.guest-head input[type="text"] {
  border: 0;
  background: transparent;
  padding: 4px 0;
  font-size: 15px;
  font-weight: 600;
  flex: 1 1 auto;
  min-width: 0;
}
.guest-head input[type="text"]:hover { border: 0; }
.guest-body { padding: 4px 15px 14px; }
/* Tick lists — one dish per course */
.ticks {
  border: 0;
  margin: 0;
  padding: 13px 0 14px;
  border-bottom: 1px solid var(--rule);
  display: grid;
  gap: 3px;
}
.ticks:last-child { border-bottom: 0; }
.ticks legend { padding: 0; margin-bottom: 5px; color: var(--ink-3); }
.tick {
  display: grid;
  grid-template-columns: 16px 1fr auto;
  gap: 11px;
  align-items: baseline;
  padding: 7px 9px 7px 7px;
  cursor: pointer;
  border: 1px solid transparent;
  transition: background-color .12s ease;
}
.tick:hover { background: var(--bone-2); }
.tick input { position: absolute; opacity: 0; pointer-events: none; }
.tick .box {
  width: 15px;
  height: 15px;
  border: 1.5px solid var(--rule-2);
  display: grid;
  place-items: center;
  position: relative;
  top: 2px;
}
.tick .box::after { content: ""; width: 7px; height: 7px; background: transparent; }
.tick input:checked ~ .box { border-color: var(--stamp); }
.tick input:checked ~ .box::after { background: var(--stamp); }
.tick input:focus-visible ~ .box { outline: 2px solid var(--stamp); outline-offset: 2px; }
.tick:has(input:checked) { background: var(--bone-2); border-color: var(--rule-2); }
.tick:has(input:checked) .tname { font-weight: 600; }
.tname { font-size: 15px; line-height: 1.3; }
.tick .supp { margin-left: 6px; }
.tprice {
  font-family: "IBM Plex Mono", monospace;
  font-size: 12px;
  color: var(--ink-3);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

/* Confirm panel */
.confirm { border: 1.5px solid var(--ink); background: var(--card); padding: 18px 18px 20px; }
.confirm h4 {
  margin: 0 0 12px;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--stamp);
}
.confirm .receipt { border-top: 1px solid var(--rule); }
.confirm .empty {
  margin: 0;
  font-family: "Newsreader", Georgia, serif;
  font-weight: 300;
  font-style: italic;
  color: var(--ink-3);
}

/* Submit */
.submit {
  appearance: none;
  border: 1.5px solid var(--ink);
  background: var(--ink);
  color: var(--bone);
  font-family: "Archivo", sans-serif;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: .1em;
  text-transform: uppercase;
  padding: 16px 32px;
  cursor: pointer;
  justify-self: start;
  transition: background .15s ease, border-color .15s ease;
}
.submit:hover { background: var(--stamp); border-color: var(--stamp); }
.submit:disabled { opacity: .55; cursor: progress; }
.err { color: var(--stamp); font-size: 14.5px; font-weight: 600; margin: 0; }

/* Confirmation */
.done { border: 1.5px solid var(--ink); background: var(--card); max-width: 780px; }
.done-head {
  background: var(--ink);
  color: var(--bone);
  padding: 12px 22px;
  display: flex;
  justify-content: space-between;
  gap: 14px;
}
.done-body { padding: 26px 22px 28px; }
.done-body p.big {
  margin: 0 0 20px;
  font-size: clamp(22px, 3.6vw, 32px);
  line-height: 1.1;
  letter-spacing: -.03em;
  font-weight: 700;
  text-transform: uppercase;
  text-wrap: balance;
}
.receipt { margin: 0; border-top: 1px solid var(--rule); }
.receipt div {
  display: flex;
  justify-content: space-between;
  gap: 18px;
  padding: 9px 0;
  border-bottom: 1px solid var(--rule);
  font-size: 15px;
}
.receipt dt {
  color: var(--ink-3);
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .06em;
  padding-top: 3px;
  flex: 0 0 auto;
  max-width: 40%;
}
.receipt dd { margin: 0; text-align: right; }
.again {
  appearance: none;
  background: transparent;
  border: 0;
  color: var(--stamp);
  padding: 0;
  margin-top: 22px;
  font-family: "Archivo", sans-serif;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
  cursor: pointer;
  text-decoration: underline;
  text-underline-offset: 4px;
}

footer { padding-top: 88px; display: grid; gap: 14px; }
footer .strip {
  border-top: 1.5px solid var(--ink);
  padding-top: 14px;
  display: flex;
  flex-wrap: wrap;
  gap: 8px 26px;
  justify-content: space-between;
}
footer p { margin: 0; max-width: 64ch; color: var(--ink-2); font-size: 14.5px; line-height: 1.55; }

[hidden] { display: none !important; }

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { transition: none !important; animation: none !important; }
}
</style>

<body>

<div class="rail rail-l"><span id="rail-l"></span></div>
<div class="rail rail-r"><span id="rail-r"></span></div>

<div class="wrap">

  <div class="topbar">
    <p class="kicker" id="kicker"></p>
    <div class="lang" role="group" aria-label="Sprog / Language">

      <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
  </div>

  <header class="hero">
    <div class="toss">

      </div>
      <p class="mono toss-caption" id="caption"></p>
      <figure class="quote" id="quote">
        <blockquote id="q-orig"></blockquote>
        <p class="q-trans" id="q-trans"></p>
        <figcaption class="mono q-by" id="q-by"></figcaption>
      </figure>
    </div>

    <h1>Planning life on a <span class="thin">coin toss</span></h1>

    <p class="sub"
       data-da="Seks lande har haft os på skift. Den 12. september lander vi det samme sted — på Norrlyst i København."
       data-en="Six countries have had us in turn. On 12 September we land in the same place — Norrlyst in Copenhagen."></p>

    <dl class="ledger">
      <div><dt class="mono" data-da="Dato" data-en="Date"></dt><dd id="f-date"></dd></div>
      <div><dt class="mono" data-da="Tid" data-en="Time"></dt><dd id="f-time"></dd></div>
      <div><dt class="mono" data-da="Sted" data-en="Where"></dt>
           <dd><a id="f-venue" href="#" target="_blank" rel="noopener noreferrer"></a></dd></div>
      <div><dt class="mono" data-da="Svar inden" data-en="Reply by"></dt><dd id="f-deadline"></dd></div>
    </dl>
  </header>

  <section id="agenda">
    <div class="sec-head">
      <h2 data-da="Aftenens gang" data-en="How the evening runs"></h2>

       data-da="Seks steder, vi har kaldt hjem på skift. Hver mønt er slået som den rigtige — hullet, ringen og skriften er ikke pynt."

    <div class="coins" id="coin-row"></div>

  <section id="menu-section">

            <input type="radio" name="attending" value="yes" checked>

<script>
(function () {
  "use strict";

  const $  = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));

  let lang = "da";
  try { lang = localStorage.getItem("rsvp-lang") || "da"; } catch (e) {}
  if (lang !== "en") lang = "da";

  const t = (v) => (v && typeof v === "object" && !Array.isArray(v) ? v[lang] : v) || "";
  const T = (da, en) => (lang === "da" ? da : en);

  /* ═══ Coins ════════════════════════════════════════════════════════
     Drawn, not photographed: a struck disc, a reeded rim, a legend on an
     arc, and either a hole or a denomination in the country's own script.
     Rim ticks are generated rather than hand-authored path data.       */

  const METAL = {
    brass:  { hi: "#F2DCA8", mid: "#C29A54", lo: "#7E5F2A", edge: "#5B441E", text: "#463316" },
    nickel: { hi: "#F6F5EE", mid: "#C7C7BC", lo: "#8B8B80", edge: "#6A6A60", text: "#43433C" },
    aged:   { hi: "#DEDCCF", mid: "#A9A79A", lo: "#706F63", edge: "#54534A", text: "#3A3932" }
  };

  const GROUND = "#EDE9DD";
  let uid = 0;

  function coinSVG(spec) {
    const id = "k" + (uid++);
    const M = METAL[spec.metal] || METAL.nickel;
    const R = spec.ring ? METAL[spec.ring] : null;
    const core = R ? 58 : 88;
    const legendR = R ? 76 : 72;

    let ticks = "";
    const N = 84;
    for (let i = 0; i < N; i++) {
      const a = (i / N) * Math.PI * 2;
      ticks += '<line x1="' + (Math.cos(a) * 92).toFixed(2) + '" y1="' + (Math.sin(a) * 92).toFixed(2) +
               '" x2="' + (Math.cos(a) * 98).toFixed(2) + '" y2="' + (Math.sin(a) * 98).toFixed(2) + '"/>';
    }

    const legendInk = (R ? R : M).text;
    const arcTop = "M-" + legendR + " 0 A" + legendR + " " + legendR + " 0 0 1 " + legendR + " 0";
    const arcBot = "M-" + legendR + " 0 A" + legendR + " " + legendR + " 0 0 0 " + legendR + " 0";

    const scriptFont = spec.script === "ar"
      ? "'Noto Sans Arabic', 'Geeza Pro', 'Segoe UI', 'Tahoma', sans-serif"
      : spec.script === "th"
        ? "'Noto Sans Thai', 'Thonburi', 'Leelawadee UI', 'Tahoma', sans-serif"
        : "Archivo, sans-serif";

    let centre;
    if (spec.hole) {
      centre =
        (spec.crown
          ? '<path d="M-26 -50 l7 14 9 -18 9 18 7 -14 4 22 h-40z" fill="none" stroke="' + M.text +
            '" stroke-width="3" stroke-linejoin="round" opacity=".72"/>'
          : '') +
        '<circle r="20" fill="' + GROUND + '"/>' +
        '<circle r="20" fill="none" stroke="' + M.edge + '" stroke-width="2.5" opacity=".8"/>' +
        '<circle r="25" fill="none" stroke="' + M.hi + '" stroke-width="1.2" opacity=".5"/>';
    } else {
      centre =
        '<text x="0" y="0" text-anchor="middle" dominant-baseline="central" ' +
        'font-family="' + scriptFont + '" font-size="' + (R ? 44 : 60) + '" font-weight="600" ' +
        'fill="' + M.text + '" opacity=".9">' + spec.denom + '</text>';
    }

    return '' +
    '<svg viewBox="-104 -104 208 208" role="img" aria-label="' + (spec.alt || "") + '">' +
      '<defs>' +
        '<radialGradient id="' + id + 'f" cx="34%" cy="28%" r="82%">' +
          '<stop offset="0%" stop-color="' + M.hi + '"/>' +
          '<stop offset="52%" stop-color="' + M.mid + '"/>' +
          '<stop offset="100%" stop-color="' + M.lo + '"/>' +
        '</radialGradient>' +
        (R ? '<radialGradient id="' + id + 'r" cx="34%" cy="28%" r="82%">' +
               '<stop offset="0%" stop-color="' + R.hi + '"/>' +
               '<stop offset="52%" stop-color="' + R.mid + '"/>' +
               '<stop offset="100%" stop-color="' + R.lo + '"/>' +
             '</radialGradient>' : '') +
        '<linearGradient id="' + id + 's" x1="8%" y1="0%" x2="92%" y2="100%">' +
          '<stop offset="0%" stop-color="#FFFFFF" stop-opacity=".40"/>' +
          '<stop offset="38%" stop-color="#FFFFFF" stop-opacity="0"/>' +
          '<stop offset="70%" stop-color="#000000" stop-opacity="0"/>' +
          '<stop offset="100%" stop-color="#000000" stop-opacity=".22"/>' +
        '</linearGradient>' +
        '<path id="' + id + 'at" d="' + arcTop + '"/>' +
        '<path id="' + id + 'ab" d="' + arcBot + '"/>' +
      '</defs>' +

      '<circle r="99" fill="' + (R ? R.edge : M.edge) + '"/>' +
      '<g stroke="' + (R ? R.lo : M.lo) + '" stroke-width="2.4" opacity=".9">' + ticks + '</g>' +
      '<circle r="92" fill="url(#' + id + (R ? 'r' : 'f') + ')"/>' +
      (R
        ? '<circle r="' + (core + 3) + '" fill="' + M.edge + '" opacity=".5"/>' +
          '<circle r="' + core + '" fill="url(#' + id + 'f)"/>'
        : '<circle r="80" fill="none" stroke="' + M.edge + '" stroke-width="1.4" opacity=".4"/>') +

      '<g font-family="Archivo, sans-serif" font-weight="700" letter-spacing="2.6" ' +
         'fill="' + legendInk + '" opacity=".92">' +
        '<text font-size="15"><textPath href="#' + id + 'at" startOffset="50%" text-anchor="middle">' +
          spec.legendTop + '</textPath></text>' +
        '<text font-size="12"><textPath href="#' + id + 'ab" startOffset="50%" text-anchor="middle">' +
          spec.legendBottom + '</textPath></text>' +
      '</g>' +

      centre +
      '<circle r="99" fill="url(#' + id + 's)"/>' +
    '</svg>';
  }

  function countrySpec(c) {
    return {
      metal: c.metal,
      ring: c.ring,
      hole: !!c.hole,
      crown: c.code === "DK",
      denom: c.denom,
      script: c.script,
      legendTop: t(c.name).toUpperCase(),
      legendBottom: c.unit,
      alt: t(c.name) + " — " + c.unit
    };
  }

  function hostSpec() {
    return {
      metal: "brass",
      ring: null,
      hole: false,
      denom: "XII",
      script: "lat",
      legendTop: "NORRLYST",
      legendBottom: "MMXXVI · " + T("KØBENHAVN", "COPENHAGEN"),
      alt: T("Middagens mønt", "The dinner's own coin")
    };
  }

  /* The toss: the coin rests visible, flips once on load, and lands on a
     new country with every tap before cycling back to the dinner's coin. */
  let turns = 0;
  let tossIndex = -1;
  let tossing = false;

  function paintCoin(spec) { $("#coin").innerHTML = coinSVG(spec); }

  function applyPalette(pal) {
    const r = document.documentElement.style;
    r.setProperty("--bone", pal.ground);
    r.setProperty("--bone-2", pal.bone2);
    r.setProperty("--card", pal.card);
    r.setProperty("--rule", pal.rule);
    r.setProperty("--rule-2", pal.rule2);
    r.setProperty("--stamp", pal.stamp);
    r.setProperty("--aura", pal.aura);
  }

  function showQuote(q, animate) {
    const fig = $("#quote");
    const orig = $("#q-orig");
    orig.textContent = t(q.orig);
    if (q.dir === "rtl") { orig.setAttribute("dir", "rtl"); } else { orig.removeAttribute("dir"); }
    $("#q-trans").textContent = q[lang] && q[lang] !== t(q.orig) ? q[lang] : "";
    $("#q-by").textContent = t(q.by);
    if (animate) {
      fig.classList.remove("struck");
      void fig.offsetWidth;
      fig.classList.add("struck");
    }
  }

  function landed() {
    return tossIndex < 0 ? CONFIG.host : CONFIG.countries[tossIndex];
  }

  function setCaption() {
    const where = tossIndex < 0
      ? T("VÆRTSLAND", "HOST COUNTRY") + " · <b>" + T("DANMARK", "DENMARK") + "</b>"
      : T("LANDEDE PÅ", "LANDED ON") + " · <b>" + t(CONFIG.countries[tossIndex].name).toUpperCase() + "</b>";
    $("#caption").innerHTML = where + " · " + T("TRYK FOR AT SLÅ", "TAP TO TOSS");
  }

  function currentSpec() {
    return tossIndex < 0 ? hostSpec() : countrySpec(CONFIG.countries[tossIndex]);
  }

  function land(animate) {
    const it = landed();
    paintCoin(currentSpec());
    applyPalette(it.palette);
    showQuote(it.quote, animate);
    setCaption();
  }

  function toss(advance) {
    if (tossing) return;
    /* The host coin is only the resting state — once tossed, the cycle
       runs through the six countries and wraps. */
    if (advance) tossIndex = (tossIndex + 1) % CONFIG.countries.length;

    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
      land(false);
      return;
    }

    tossing = true;
    turns += 3;
    $("#coin").style.transform = "rotateY(" + (turns * 360) + "deg) rotateX(12deg)";
    window.setTimeout(function () { land(true); }, 620);
    window.setTimeout(function () { tossing = false; }, 1400);
  }

  function renderCountries() {
    $("#coin-row").innerHTML = CONFIG.countries.map(function (c) {
      return '<article class="country">' +
               '<div class="disc">' + coinSVG(countrySpec(c)) + "</div>" +
               "<h3>" + t(c.name) + "</h3>" +
               "<p>" + t(c.fact) + "</p>" +
             "</article>";
    }).join("");
  }

  function renderAgenda() {
    $("#agenda-list").innerHTML = CONFIG.agenda.map(function (row) {
      return "<li><span class=\"t\">" + row.time + "</span>" +
             '<span class="l">' + t(row.label) +
               (row.aside ? '<span class="a">' + t(row.aside) + "</span>" : "") +
             "</span></li>";
    }).join("");
  }

  /* ═══ Menu ═════════════════════════════════════════════════════════ */
  const priceOf = (d) => d.label || String(d.price);

  function renderMenu() {
    $("#menu").innerHTML = CONFIG.courses.map(function (course) {
      const dishes = course.dishes.map(function (d) {
        return '<div class="dish">' +
                 "<h4>" + d.name + (d.supp ? '<span class="supp">+' + d.supp + "</span>" : "") + "</h4>" +
                 '<p class="price">' + priceOf(d) + "</p>" +
                 '<p class="desc">' + d.desc + "</p>" +
               "</div>";
      }).join("");
      return '<div class="course"><h3>' + t(course.name) + '</h3><hr class="rule">' + dishes + "</div>";
    }).join("");

    $("#menu-note").textContent = T(
      "Priser i kroner, som de står på kortet. Tallet i ringen er tillægget, hvis retten tages som del af en menu. Det endelige format bekræftes med restauranten.",
      "Prices in kroner, as printed on the card. The number in the ring is the supplement if the dish is taken as part of a menu. The final format is being confirmed with the restaurant."
    );
  }

  /* ═══ Guests ═══════════════════════════════════════════════════════ */
  let party = 1;

  function tick(i, course, value, label, price, supp) {
    return '<label class="tick">' +
             '<input type="radio" name="g' + i + "-" + course + '" value="' + value +
               '" data-guest="' + i + '" data-course="' + course + '">' +
             '<span class="box"></span>' +
             '<span class="tname">' + label +
               (supp ? '<span class="supp">+' + supp + "</span>" : "") + "</span>" +
             '<span class="tprice">' + (price || "") + "</span>" +
           "</label>";
  }

  function guestRow(i) {
    const picks = CONFIG.courses.map(function (course) {
      const rows = course.dishes.map(function (d) {
        return tick(i, course.id, d.id, d.name, priceOf(d), d.supp);
      }).join("") + tick(i, course.id, "skip", T("Ingen tak", "None, thanks"), "", 0);

      return '<fieldset class="ticks">' +
               '<legend class="mono">' + t(course.name) + "</legend>" +
               rows +
             "</fieldset>";
    }).join("");

    const ph = i === 0 ? T("Dit navn", "Your name") : T("Gæst " + (i + 1), "Guest " + (i + 1));

    return '<div class="guest">' +
             '<div class="guest-head">' +
               '<span class="seat">' + String(i + 1).padStart(2, "0") + "</span>" +
               '<input type="text" data-guest-name="' + i + '" autocomplete="off" placeholder="' + ph + '">' +
             "</div>" +
             '<div class="guest-body">' + picks + "</div>" +
           "</div>";
  }

  function readGuests() {
    return $$(".guest", $("#guests")).map(function (row, i) {
      const choices = {};
      $$('input[type="radio"]:checked', row).forEach(function (r) {
        choices[r.dataset.course] = r.value;
      });
      const nameEl = $('[data-guest-name="' + i + '"]', row);
      return {
        name: nameEl ? nameEl.value : "",
        touched: !!(nameEl && nameEl.dataset.touched),
        choices: choices
      };
    });
  }

  function renderGuests() {
    const wrap = $("#guests");
    const keep = readGuests();
    wrap.innerHTML = Array.from({ length: party }, function (_, i) { return guestRow(i); }).join("");

    keep.slice(0, party).forEach(function (g, i) {
      const nameEl = $('[data-guest-name="' + i + '"]', wrap);
      if (nameEl && g.name) {
        nameEl.value = g.name;
        if (g.touched) nameEl.dataset.touched = "1";
      }
      Object.keys(g.choices).forEach(function (courseId) {
        const r = $('input[name="g' + i + "-" + courseId + '"][value="' + g.choices[courseId] + '"]', wrap);
        if (r) r.checked = true;
      });
    });

    const first = $('[data-guest-name="0"]', wrap);
    if (first && !first.dataset.touched) first.value = $("#name").value.trim();

    renderPreview();
    $("#minus").disabled = party <= 1;
    $("#plus").disabled = party >= CONFIG.maxGuests;
    $("#party").textContent = String(party);
  }

  /* ═══ Language ═════════════════════════════════════════════════════ */
  function applyLang() {
    document.documentElement.lang = lang;
    $$("[data-da]").forEach(function (el) { el.innerHTML = el.getAttribute("data-" + lang); });
    $$("[data-ph-da]").forEach(function (el) { el.placeholder = el.getAttribute("data-ph-" + lang); });
    $$(".lang button").forEach(function (b) {
      b.setAttribute("aria-pressed", String(b.dataset.lang === lang));
    });

    $("#kicker").textContent = T(
      "Genforeningsmiddag · seks lande, ét bord",
      "Reunion dinner · six countries, one table"
    );
    $("#rail-l").textContent = T("Plat eller krone · 12.09.2026", "Heads or tails · 12.09.2026");
    $("#rail-r").textContent = (CONFIG.venue + " · " + t(CONFIG.city)).toUpperCase();

    $("#f-date").textContent = t(CONFIG.date);
    $("#f-time").textContent = t(CONFIG.time);
    $("#f-deadline").textContent = t(CONFIG.deadline);
    const venue = $("#f-venue");
    venue.textContent = CONFIG.venue;
    venue.href = CONFIG.venueUrl;

    $("#foot-mark").textContent = T("Genforeningsmiddag", "Reunion dinner") + " · MMXXVI";
    $("#foot-place").textContent = (CONFIG.venue + " · " + t(CONFIG.city)).toUpperCase();
    $("#foot-note").innerHTML = T(
      "Svar gerne inden <strong>" + t(CONFIG.deadline) +
        "</strong>, så vi kan give Norrlyst det endelige antal og køkkenet en fornemmelse af kortet. Spørgsmål? Skriv til " +
        CONFIG.hostName + " på ",
      "Please reply by <strong>" + t(CONFIG.deadline) +
        "</strong> so we can give Norrlyst the final count and the kitchen a feel for the card. Questions? Write to " +
        CONFIG.hostName + " at "
    ) + '<a href="mailto:' + CONFIG.hostEmail + '">' + CONFIG.hostEmail + "</a>.";

    renderAgenda();
    renderCountries();
    renderMenu();
    renderGuests();
    land(false);
  }

  /* ═══ Attendance ═══════════════════════════════════════════════════ */
  function attending() {
    const el = $('input[name="attending"]:checked');
    return !el || el.value === "yes";
  }
  function syncAttending() {
    const yes = attending();
    $("#party-field").hidden = !yes;
    $("#guests-field").hidden = !yes;
    $("#step-2").hidden = !yes;
    $("#send").textContent = yes ? T("Send tilmelding", "Send RSVP") : T("Send afbud", "Send regrets");
    renderPreview();
  }

  /* ═══ Submit ═══════════════════════════════════════════════════════ */
  function dishById(courseId, dishId) {
    const c = CONFIG.courses.find(function (x) { return x.id === courseId; });
    return c ? c.dishes.find(function (d) { return d.id === dishId; }) : null;
  }

  function payload() {
    const yes = attending();
    const raw = yes ? readGuests() : [];
    const kitchen = {};

    const guests = raw.map(function (g, i) {
      const order = {};
      CONFIG.courses.forEach(function (course) {
        const v = g.choices[course.id];
        if (!v) { order[course.id] = ""; return; }
        if (v === "skip") { order[course.id] = T("Ingen tak", "None"); return; }
        const d = dishById(course.id, v);
        order[course.id] = d ? d.name : v;
        if (d) kitchen[d.name] = (kitchen[d.name] || 0) + 1;
      });
      return {
        seat: i + 1,
        name: g.name.trim() || (i === 0 ? $("#name").value.trim() : ""),
        order: order
      };
    });

    return {
      attending: yes ? "yes" : "no",
      name: $("#name").value.trim(),
      party: yes ? party : 0,
      guests: guests,
      kitchen: kitchen,
      rows: guests.map(function (g) {
        return [g.name || "?"].concat(CONFIG.courses.map(function (c) {
          return g.order[c.id] || "-";
        })).join(" | ");
      }).join("\n"),
      diet: $("#diet").value.trim(),
      note: $("#note").value.trim(),
      event: CONFIG.venue + " — " + CONFIG.date.da,
      submittedAt: new Date().toISOString()
    };
  }

  function asText(d) {
    const lines = [
      d.attending === "yes" ? "KOMMER / ATTENDING" : "AFBUD / CANNOT ATTEND",
      "Navn / Name: " + d.name,
      "Antal / Party: " + d.party,
      ""
    ];
    d.guests.forEach(function (g) {
      lines.push(g.seat + ". " + (g.name || "—"));
      CONFIG.courses.forEach(function (c) {
        lines.push("   " + c.name.da + ": " + (g.order[c.id] || "—"));
      });
      lines.push("");
    });
    const keys = Object.keys(d.kitchen);
    if (keys.length) {
      lines.push("TIL KØKKENET / KITCHEN TALLY");
      keys.forEach(function (k) { lines.push("   " + k + " × " + d.kitchen[k]); });
      lines.push("");
    }
    if (d.diet) lines.push("Allergier / Dietary: " + d.diet);
    if (d.note) lines.push("Hilsen / Note: " + d.note);
    return lines.join("\n");
  }

  /* Step 03 — a live reading of exactly what the send button will post. */
  function renderPreview() {
    const box = $("#preview");
    const d = payload();
    const none = T("Ingen tak", "None");
    const rows = [];

    if (!d.name) {
      box.innerHTML = '<p class="empty">' +
        T("Udfyld navnet ovenfor, så samler vi det hele her.",
          "Fill in the name above and it all gathers here.") + "</p>";
      return;
    }

    rows.push([T("Navn", "Name"), d.name]);
    if (d.attending === "yes") {
      rows.push([T("Antal", "Party"), String(d.party)]);
      d.guests.forEach(function (g) {
        const order = CONFIG.courses
          .map(function (c) { return g.order[c.id]; })
          .filter(function (x) { return x && x !== none; });
        rows.push([
          g.name || T("Gæst ", "Guest ") + g.seat,
          order.length ? order.join(" · ") : T("Intet valgt endnu", "Nothing ticked yet")
        ]);
      });
      if (d.diet) rows.push([T("Hensyn", "Needs"), d.diet]);
    } else {
      rows.push([T("Svar", "Answer"), T("Afbud", "Regrets")]);
    }
    if (d.note) rows.push([T("Hilsen", "Note"), d.note]);

    box.innerHTML = rows.map(function (r) {
      return "<div><dt>" + r[0] + "</dt><dd>" + r[1] + "</dd></div>";
    }).join("");
  }

  function showDone(d, viaEmail) {
    const yes = d.attending === "yes";
    $("#rsvp").hidden = true;
    $("#menu-section").hidden = true;
    $("#done").hidden = false;

    const first = d.name.split(" ")[0] || "";
    $("#done-line").textContent = yes
      ? T("Vi ses den 12.", "See you on the 12th.")
      : T("Ærgerligt — vi savner dig den aften.", "A shame — you'll be missed that evening.");
    $("#done-stamp").textContent = (first || CONFIG.venue).toUpperCase();

    const none = T("Ingen tak", "None");
    const rows = [[T("Navn", "Name"), d.name]];
    if (yes) {
      rows.push([T("Antal", "Party"), String(d.party)]);
      d.guests.forEach(function (g) {
        const order = CONFIG.courses
          .map(function (c) { return g.order[c.id]; })
          .filter(function (x) { return x && x !== none; });
        rows.push([
          g.name || T("Gæst ", "Guest ") + g.seat,
          order.length ? order.join(" · ") : T("Ikke valgt endnu", "Not chosen yet")
        ]);
      });
      if (d.diet) rows.push([T("Hensyn", "Needs"), d.diet]);
    }
    rows.push([T("Dato", "Date"), t(CONFIG.date)]);
    if (viaEmail) rows.push([T("Status", "Status"), T("Sendt som e-mail", "Sent by email")]);

    $("#receipt").innerHTML = rows.map(function (r) {
      return "<div><dt>" + r[0] + "</dt><dd>" + r[1] + "</dd></div>";
    }).join("");

    $("#done").scrollIntoView({ behavior: "smooth", block: "center" });
  }

  function mailFallback(d) {
    const subject = encodeURIComponent(
      (d.attending === "yes" ? "RSVP: " : "Afbud: ") + d.name + " — " + CONFIG.venue
    );
    window.location.href = "mailto:" + CONFIG.hostEmail +
      "?subject=" + subject + "&body=" + encodeURIComponent(asText(d));
    showDone(d, true);
  }

  $("#rsvp").addEventListener("submit", function (e) {
    e.preventDefault();
    const err = $("#err");
    err.hidden = true;

    const nameEl = $("#name");
    if (!nameEl.value.trim()) {
      err.textContent = T("Skriv lige dit navn, så vi ved hvem der kommer.",
                          "Add your name so we know who's coming.");
      err.hidden = false;
      nameEl.focus();
      return;
    }

    const d = payload();
    if (!CONFIG.endpoint) { mailFallback(d); return; }

    const btn = $("#send");
    btn.disabled = true;
    btn.textContent = T("Sender…", "Sending…");

    fetch(CONFIG.endpoint, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Accept": "application/json" },
      body: JSON.stringify(Object.assign({}, d, { summary: asText(d) }))
    })
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        showDone(d, false);
      })
      .catch(function () {
        btn.disabled = false;
        syncAttending();
        err.innerHTML = T("Tilmeldingen kunne ikke sendes. Prøv igen, eller ",
                          "That didn't go through. Try again, or ") +
          '<a href="#" id="mailnow">' + T("send den som e-mail", "send it by email") + "</a>.";
        err.hidden = false;
        const link = $("#mailnow");
        if (link) {
          link.addEventListener("click", function (ev) { ev.preventDefault(); mailFallback(d); });
        }
      });
  });

  /* ═══ Wiring ═══════════════════════════════════════════════════════ */
  $("#coin").addEventListener("click", function () { toss(true); });
  $("#minus").addEventListener("click", function () { if (party > 1) { party -= 1; renderGuests(); } });
  $("#plus").addEventListener("click", function () {
    if (party < CONFIG.maxGuests) { party += 1; renderGuests(); }
  });
  $$('input[name="attending"]').forEach(function (r) {
    r.addEventListener("change", syncAttending);
  });
  $("#name").addEventListener("input", function () {
    const first = $('[data-guest-name="0"]');
    if (first && !first.dataset.touched) first.value = this.value.trim();
  });
  document.addEventListener("input", function (e) {
    if (e.target.matches("[data-guest-name]")) e.target.dataset.touched = "1";
    if (e.target.closest("#rsvp")) renderPreview();
  });
  $("#rsvp").addEventListener("change", renderPreview);
  $("#again").addEventListener("click", function () {
    $("#done").hidden = true;
    $("#rsvp").hidden = false;
    $("#menu-section").hidden = false;
    syncAttending();
    $("#rsvp").scrollIntoView({ behavior: "smooth", block: "start" });
  });
  $$(".lang button").forEach(function (b) {
    b.addEventListener("click", function () {
      lang = b.dataset.lang;
      try { localStorage.setItem("rsvp-lang", lang); } catch (e) {}
      applyLang();
      syncAttending();
    });
  });

  applyLang();
  syncAttending();
  window.setTimeout(function () { toss(false); }, 420);
})();
</script>
</body>
</html>
