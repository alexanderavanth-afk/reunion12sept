  // Fallback + "questions?" address.
  hostEmail: "alexander.avanth@gmail.com",
  hostName: "Alexander",

  // The evening.
  date:      { da: "Lørdag den 12. september", en: "Saturday 12 September" },
  time:      "18:30",
  venue:     "Restaurant Norrlyst",
  venueUrl:  "https://norrlyst.dk/restaurantnorrlyst/aften/",
  deadline:  { da: "9. september", en: "9 September" },
  maxGuests: 8,

  // The menu. Norrlyst serves a set four-course menu in the evening, in two
  // versions. Replace the `courses` lines with the current dishes from
  // norrlyst.dk when you have them — the layout takes any number of courses.
  price: "495 kr.",
  menus: [
    {
      id: "klassisk",
      name:  { da: "Norrlyst-menuen", en: "The Norrlyst menu" },
      kind:  { da: "Kød, fisk & skaldyr", en: "Meat, fish & shellfish" },
      blurb: { da: "Køkkenets firerettersmenu, sat efter sæsonen.",
               en: "The kitchen's four-course menu, set by the season." },
      courses: [
        { da: "Forret",      en: "First course" },
        { da: "Mellemret",   en: "Middle course" },
        { da: "Hovedret",    en: "Main course" },
        { da: "Dessert",     en: "Dessert" }
      ]
    },
    {
      id: "gron",
      name:  { da: "Den grønne Norrlyst-menu", en: "The green Norrlyst menu" },
      kind:  { da: "Vegetarisk", en: "Vegetarian" },
      blurb: { da: "Samme fire retter med grøntsagerne i hovedrollen.",
               en: "The same four courses with vegetables in the lead." },
      courses: [
        { da: "Forret",      en: "First course" },
        { da: "Mellemret",   en: "Middle course" },
        { da: "Hovedret",    en: "Main course" },
        { da: "Dessert",     en: "Dessert" }
      ]
    }
  ]
};

<body>
<div class="page">

  <div class="topbar">
    <span class="mono mark" id="mark">Norrlyst · 2026</span>
    <div class="lang" role="group" aria-label="Sprog / Language">
      <button type="button" data-lang="da" aria-pressed="true">DA</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
  </div>

  <header class="hero">
    <p class="mono eyebrow" id="eyebrow"></p>
    <h1 data-da="Genforenings&shy;middag" data-en="The reunion dinner"></h1>
    <p class="standfirst"
       data-da="Vi samles om en firerettersmenu på Norrlyst. Sig til hvor mange I er, og hvad I gerne vil spise — så giver vi køkkenet besked."
       data-en="We're gathering around a four-course menu at Norrlyst. Tell us how many you are and what you'd like to eat, and we'll pass it to the kitchen."></p>

    <dl class="facts">
      <div class="fact">
        <dt class="mono" data-da="Dato" data-en="Date"></dt>
        <dd id="f-date"></dd>
      </div>
      <div class="fact">
        <dt class="mono" data-da="Tid" data-en="Time"></dt>
        <dd id="f-time"></dd>
      </div>
      <div class="fact">
        <dt class="mono" data-da="Sted" data-en="Where"></dt>
        <dd><a id="f-venue" href="#" target="_blank" rel="noopener noreferrer"></a></dd>
      </div>
    </dl>
  </header>

  <section id="menu-section">
    <h2 data-da="Aftenens menu" data-en="The evening menu"></h2>
    <div class="menus" id="menus"></div>
    <p class="menu-note" id="menu-note"></p>
  </section>

  <section id="rsvp-section">
    <h2 data-da="Tilmelding" data-en="RSVP"></h2>

    <form id="rsvp" novalidate>
      <div class="field">
        <span class="lbl" data-da="Kommer I?" data-en="Are you coming?"></span>
        <div class="choice">
          <label>
            <input type="radio" name="attending" value="yes" checked>
            <span class="dot"></span>
            <span data-da="Ja, vi kommer" data-en="Yes, we'll be there"></span>
          </label>
          <label>
            <input type="radio" name="attending" value="no">
            <span class="dot"></span>
            <span data-da="Kan desværre ikke" data-en="Sadly can't make it"></span>
          </label>
        </div>
      </div>

      <div class="field">
        <label class="lbl" for="name" data-da="Dit navn" data-en="Your name"></label>
        <input type="text" id="name" name="name" autocomplete="name" required
               data-ph-da="Fornavn og efternavn" data-ph-en="First and last name">
      </div>

      <div class="field" id="party-field">
        <span class="lbl" data-da="Hvor mange kommer I?" data-en="How many of you are coming?"></span>
        <span class="hint" data-da="Dig selv talt med." data-en="Including yourself."></span>
        <div class="stepper">
          <button type="button" id="minus" aria-label="Én færre / One fewer">−</button>
          <output id="party" for="minus plus">1</output>
          <button type="button" id="plus" aria-label="Én mere / One more">+</button>
        </div>
      </div>

      <div class="field" id="guests-field">
        <span class="lbl" data-da="Hvad skal I spise?" data-en="What would you like to eat?"></span>
        <span class="hint"
              data-da="Vælg en menu pr. person. Navne hjælper med bordkortene."
              data-en="One menu per person. Names help us with the place cards."></span>
        <div class="guests" id="guests"></div>
      </div>

      <div class="field">
        <label class="lbl" for="diet"
               data-da="Allergier og hensyn" data-en="Allergies and dietary needs"></label>
        <span class="hint"
              data-da="Køkkenet tilpasser gerne — skriv hvem det gælder."
              data-en="The kitchen will adapt — say who it applies to."></span>
        <textarea id="diet" name="diet"
                  data-ph-da="F.eks. “Maja: nødder og skaldyr”"
                  data-ph-en="e.g. “Maja: nuts and shellfish”"></textarea>
      </div>

      <div class="field">
        <label class="lbl" for="note"
               data-da="Hilsen til værterne" data-en="A note to the hosts"></label>

      <div class="formfoot">

      <button type="button" class="again" id="again"
              data-da="Ret min tilmelding" data-en="Change my answer"></button>
    </div>
  </section>

  <footer>
    <p id="foot-1"></p>
  </footer>

<script>
(function () {
  "use strict";

  const $  = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));

  let lang = "da";
  try { lang = localStorage.getItem("rsvp-lang") || "da"; } catch (e) {}
  if (lang !== "en") lang = "da";

  const t = (obj) => (obj && typeof obj === "object" ? obj[lang] : obj) || "";

  /* ── Menus ──────────────────────────────────────────────────────── */
  function renderMenus() {
    $("#menus").innerHTML = CONFIG.menus.map(function (m) {
      const courses = m.courses.map(function (c, i) {
        return '<li><span>' + String(i + 1).padStart(2, "0") + '</span>' + t(c) + '</li>';
      }).join("");
      return '<article class="menu">' +
               '<p class="mono kind">' + t(m.kind) + '</p>' +
               '<h3>' + t(m.name) + '</h3>' +
               '<p>' + t(m.blurb) + '</p>' +
               '<ol>' + courses + '</ol>' +
             '</article>';
    }).join("");
  }

  /* ── Guest rows ─────────────────────────────────────────────────── */
  let party = 1;

  function guestRow(i) {
    const seat = String(i + 1).padStart(2, "0");
    const options = CONFIG.menus.map(function (m) {
      return '<label><input type="radio" name="menu-' + i + '" value="' + m.id + '"' +
             (m.id === CONFIG.menus[0].id ? " checked" : "") + '>' + t(m.name) + '</label>';
    }).join("");
    const you = lang === "da" ? "Dig" : "You";
    const other = lang === "da" ? "Gæst " + (i + 1) : "Guest " + (i + 1);
    const ph = lang === "da" ? "Navn" : "Name";
    return '<div class="guest">' +
             '<div class="guest-head">' +
               '<span class="mono n">' + seat + '</span>' +
               '<span class="mono n">' + (i === 0 ? you : other) + '</span>' +
             '</div>' +
             '<input type="text" data-guest-name="' + i + '" placeholder="' + ph + '" autocomplete="off">' +
             '<div class="seg">' + options + '</div>' +
           '</div>';
  }

  function renderGuests() {
    const wrap = $("#guests");
    const keep = readGuests();
    wrap.innerHTML = Array.from({ length: party }, (_, i) => guestRow(i)).join("");
    keep.slice(0, party).forEach(function (g, i) {
      const nameEl = $('[data-guest-name="' + i + '"]', wrap);
      if (nameEl && g.name) nameEl.value = g.name;
      const pick = $('input[name="menu-' + i + '"][value="' + g.menu + '"]', wrap);
      if (pick) pick.checked = true;
    });
    if (party === 1) {
      const first = $('[data-guest-name="0"]', wrap);
      if (first && !first.value) first.value = $("#name").value.trim();
    }
    $("#minus").disabled = party <= 1;
    $("#plus").disabled = party >= CONFIG.maxGuests;
    $("#party").textContent = String(party);
  }

  function readGuests() {
    return $$(".guest", $("#guests")).map(function (row, i) {
      const picked = $('input[name="menu-' + i + '"]:checked', row);
      return {
        name: ($('[data-guest-name="' + i + '"]', row) || {}).value || "",
        menu: picked ? picked.value : CONFIG.menus[0].id
      };
    });
  }

  /* ── Language ───────────────────────────────────────────────────── */
  function applyLang() {
    document.documentElement.lang = lang;
    $$("[data-da]").forEach(function (el) {
      el.innerHTML = el.getAttribute("data-" + lang);
    });
    $$("[data-ph-da]").forEach(function (el) {
      el.placeholder = el.getAttribute("data-ph-" + lang);
    });
    $$(".lang button").forEach(function (b) {
      b.setAttribute("aria-pressed", String(b.dataset.lang === lang));
    });

    $("#eyebrow").textContent = t(CONFIG.date).toUpperCase() + " · " + CONFIG.venue;
    $("#f-date").textContent  = t(CONFIG.date);
    $("#f-time").textContent  = CONFIG.time;
    const venue = $("#f-venue");
    venue.textContent = CONFIG.venue;
    venue.href = CONFIG.venueUrl;

    $("#menu-note").textContent = lang === "da"
      ? "Firerettersmenu, " + CONFIG.price + " pr. person. Retterne følger sæsonen og sættes af køkkenet — du vælger blot hvilken af de to menuer du vil have."
      : "Four courses, " + CONFIG.price + " per person. The dishes follow the season and are set by the kitchen — you simply choose which of the two menus you'd like.";

    $("#foot-1").innerHTML = (lang === "da"
      ? "Svar gerne inden <strong>" + t(CONFIG.deadline) + "</strong>, så vi kan give Norrlyst det endelige antal. Spørgsmål? Skriv til " + CONFIG.hostName + " på "
      : "Please reply by <strong>" + t(CONFIG.deadline) + "</strong> so we can give Norrlyst the final count. Questions? Write to " + CONFIG.hostName + " at ")
      + '<a href="mailto:' + CONFIG.hostEmail + '">' + CONFIG.hostEmail + "</a>.";

    renderMenus();
    renderGuests();
  }

  /* ── Attendance toggle ──────────────────────────────────────────── */
  function attending() {
    const el = $('input[name="attending"]:checked');
    return !el || el.value === "yes";
  }
  function syncAttending() {
    const yes = attending();
    $("#party-field").hidden  = !yes;
    $("#guests-field").hidden = !yes;
    $("#menu-section").hidden = !yes;
    $("#send").textContent = yes
      ? (lang === "da" ? "Send tilmelding" : "Send RSVP")
      : (lang === "da" ? "Send afbud" : "Send regrets");
  }

  /* ── Submit ─────────────────────────────────────────────────────── */
  function payload() {
    const yes = attending();
    const guests = yes ? readGuests() : [];
    const tally = {};
    CONFIG.menus.forEach(function (m) { tally[m.id] = 0; });
    guests.forEach(function (g) { if (g.menu in tally) tally[g.menu] += 1; });

    return {
      attending: yes ? "yes" : "no",
      name: $("#name").value.trim(),
      party: yes ? party : 0,
      guests: guests.map(function (g, i) {
        return {
          seat: i + 1,
          name: g.name.trim() || (i === 0 ? $("#name").value.trim() : ""),
          menu: g.menu,
          menuLabel: t((CONFIG.menus.find(function (m) { return m.id === g.menu; }) || {}).name)
        };
      }),
      tally: tally,
      diet: $("#diet").value.trim(),
      note: $("#note").value.trim(),
      event: CONFIG.venue + " — " + CONFIG.date.da,
      submittedAt: new Date().toISOString()
    };
  }

  function asText(d) {
    const lines = [
      (d.attending === "yes" ? "KOMMER / ATTENDING" : "AFBUD / CANNOT ATTEND"),
      "Navn / Name: " + d.name,
      "Antal / Party: " + d.party
    ];
    d.guests.forEach(function (g) {
      lines.push("  " + g.seat + ". " + (g.name || "—") + " — " + g.menuLabel);
    });
    if (d.diet) lines.push("Allergier / Dietary: " + d.diet);
    if (d.note) lines.push("Hilsen / Note: " + d.note);
    return lines.join("\n");
  }

  function showDone(d, viaEmail) {
    const yes = d.attending === "yes";
    $("#rsvp").hidden = true;
    $("#menu-section").hidden = true;
    $("#done").hidden = false;

    $("#done-line").textContent = yes
      ? (lang === "da"
          ? "Vi glæder os til at se dig, " + (d.name.split(" ")[0] || "") + "."
          : "We can't wait to see you, " + (d.name.split(" ")[0] || "") + ".")
      : (lang === "da"
          ? "Ærgerligt — vi savner dig den aften."
          : "A shame — you'll be missed that evening.");

    const rows = [];
    const L = lang === "da"
      ? { who: "Navn", n: "Antal", when: "Dato", diet: "Hensyn", sent: "Status" }
      : { who: "Name", n: "Party", when: "Date", diet: "Needs", sent: "Status" };
    rows.push([L.who, d.name]);
    if (yes) {
      rows.push([L.n, String(d.party)]);
      CONFIG.menus.forEach(function (m) {
        if (d.tally[m.id]) rows.push([t(m.name), String(d.tally[m.id])]);
      });
      if (d.diet) rows.push([L.diet, d.diet]);
    }
    rows.push([L.when, t(CONFIG.date)]);
    if (viaEmail) {
      rows.push([L.sent, lang === "da" ? "Sendt som e-mail" : "Sent by email"]);
    }
    $("#receipt").innerHTML = rows.map(function (r) {
      return "<div><dt>" + r[0] + "</dt><dd>" + r[1] + "</dd></div>";
    }).join("");

    $("#done").scrollIntoView({ behavior: "smooth", block: "start" });
  }

  function mailFallback(d) {
    const subject = encodeURIComponent(
      (d.attending === "yes" ? "RSVP: " : "Afbud: ") + d.name + " — " + CONFIG.venue
    );
    window.location.href = "mailto:" + CONFIG.hostEmail +
      "?subject=" + subject + "&body=" + encodeURIComponent(asText(d));
    showDone(d, true);
  }

  $("#rsvp").addEventListener("submit", function (e) {
    e.preventDefault();
    const err = $("#err");
    err.hidden = true;

    const nameEl = $("#name");
    if (!nameEl.value.trim()) {
      err.textContent = lang === "da"
        ? "Skriv lige dit navn, så vi ved hvem der kommer."
        : "Add your name so we know who's coming.";
      err.hidden = false;
      nameEl.focus();
      return;
    }

    const d = payload();

    if (!CONFIG.endpoint) { mailFallback(d); return; }

    const btn = $("#send");
    btn.disabled = true;
    btn.textContent = lang === "da" ? "Sender…" : "Sending…";

    fetch(CONFIG.endpoint, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Accept": "application/json" },
      body: JSON.stringify(Object.assign({}, d, { summary: asText(d) }))
    })
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        showDone(d, false);
      })
      .catch(function () {
        btn.disabled = false;
        syncAttending();
        err.innerHTML = (lang === "da"
          ? "Tilmeldingen kunne ikke sendes. Prøv igen, eller "
          : "That didn't go through. Try again, or ")
          + '<a href="#" id="mailnow">'
          + (lang === "da" ? "send den som e-mail" : "send it by email")
          + "</a>.";
        err.hidden = false;
        const link = $("#mailnow");
        if (link) link.addEventListener("click", function (ev) {
          ev.preventDefault();
          mailFallback(d);
        });
      });
  });

  /* ── Wiring ─────────────────────────────────────────────────────── */
  $("#minus").addEventListener("click", function () {
    if (party > 1) { party -= 1; renderGuests(); }
  });
  $("#plus").addEventListener("click", function () {
    if (party < CONFIG.maxGuests) { party += 1; renderGuests(); }
  });
  $$('input[name="attending"]').forEach(function (r) {
    r.addEventListener("change", syncAttending);
  });
  $("#name").addEventListener("input", function () {
    const first = $('[data-guest-name="0"]');
    if (first && !first.dataset.touched) first.value = this.value.trim();
  });
  document.addEventListener("input", function (e) {
    if (e.target.matches("[data-guest-name]")) e.target.dataset.touched = "1";
  });
  $("#again").addEventListener("click", function () {
    $("#done").hidden = true;
    $("#rsvp").hidden = false;
    syncAttending();
    $("#rsvp").scrollIntoView({ behavior: "smooth", block: "start" });
  });
  $$(".lang button").forEach(function (b) {
    b.addEventListener("click", function () {
      lang = b.dataset.lang;
      try { localStorage.setItem("rsvp-lang", lang); } catch (e) {}
      applyLang();
      syncAttending();
    });
  });

  applyLang();
  syncAttending();
})();
</script>
</body>
</html>
